[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpconnect"
version = "0.1.0"
description = "Free GlobalProtect VPN client for Linux: SAML login plus openconnect"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Janko Slavic", email = "janko.slavic@gmail.com" }]
keywords = ["globalprotect", "vpn", "openconnect", "saml", "palo alto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
]
dependencies = [
    "requests>=2.25",
    "cryptography>=3.4",
]

[project.optional-dependencies]
# The embedded login window additionally needs the distribution packages
# python3-gi and gir1.2-webkit2-4.1, which are not installable from PyPI.
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
gpconnect = "gpconnect.cli:run"

[project.urls]
Homepage = "https://github.com/ladisk/gpconnect"
Issues = "https://github.com/ladisk/gpconnect/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
